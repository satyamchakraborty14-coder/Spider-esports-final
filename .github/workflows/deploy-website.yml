name: Build Spider Esports APK & Deploy Website

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using Android SDK at: $SDK_DIR"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: spider-debug-keystore-v1

      - name: Restore Firebase config & registered keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: Missing app/google-services.json. Add GOOGLE_SERVICES_JSON in GitHub Settings -> Secrets -> Actions."
            exit 1
          fi
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              echo "Generating GitHub debug.keystore..."
              keytool -genkeypair -v -keystore debug.keystore \
                -alias androiddebugkey -storepass android -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          FINGERPRINTS="$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:' || true)"
          echo "=== APK Signing Fingerprints (must be registered in Firebase Console for Google Sign-In) ==="
          echo "$FINGERPRINTS"
          {
            echo "### Spider Esports APK Signing Fingerprints"
            echo "Add these in Firebase Console -> Project Settings -> \`com.aistudio.spideresports.vkmrqp\` -> Add fingerprint (required once for Google Sign-In):"
            echo '```text'
            echo "$FINGERPRINTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Spider Esports APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK into website downloads
        run: |
          mkdir -p website/downloads
          cp app/build/outputs/apk/debug/app-debug.apk website/downloads/SpiderEsports-v1.0.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderEsports-v1.0
          path: website/downloads/SpiderEsports-v1.0.apk

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
